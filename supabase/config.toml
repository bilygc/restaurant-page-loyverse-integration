# Supabase LOCAL development configuration — scaffolding only.
#
# This project targets the local Supabase stack exclusively. Nothing here
# connects to a linked or production project.
#
# Intentionally OUT OF SCOPE for this init (deferred to a later `dba` task):
#   - business schema (orders, order_items, events, loyverse item mapping,
#     retry queue — see plan §9.7)
#   - RLS policies, storage buckets, Realtime publications, extensions
#   - auth model (guest checkout vs accounts, staff/admin)
#
# Mirrors the `supabase init` default layout so `dev` and `frontend` can
# reference local endpoints. Full reference:
# https://supabase.com/docs/guides/local-development/cli/config

# Distinguishes this project on the local host. Defaults to the working
# directory name when running `supabase init`.
project_id = "restaurant-page-loyverse-integration"

[api]
enabled = true
# REST/GraphQL/Auth gateway: http://127.0.0.1:54321
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Direct Postgres: postgresql://postgres:postgres@127.0.0.1:54322/postgres
port = 54322
# Used by `supabase db diff` for the shadow database.
shadow_port = 54320

[db.seed]
enabled = true
# supabase/seed.sql — comment-only placeholder for now.
sql_paths = ["./seed.sql"]

[studio]
enabled = true
# Dashboard: http://127.0.0.1:54323
port = 54323

[storage]
# Storage placeholder per plan §1-3 (menu images). No buckets or policies
# are defined yet; they are deferred to a later `dba` task.
enabled = true
file_size_limit = "50MiB"

[auth]
# Local Auth service (on by default). The auth model is still an OPEN
# QUESTION and is NOT decided here — no providers/hooks/policies configured.
enabled = true
site_url = "http://127.0.0.1:3000"

# Realtime, extensions, publications and buckets are deliberately not
# configured: plan §9.2 defers Realtime until polling/SSE is insufficient.
